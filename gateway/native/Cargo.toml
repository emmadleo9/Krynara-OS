[package]
name = "krynara-native"
version = "0.1.0"
edition = "2021"
description = "Krynara-OS native compute sidecar: system stats, GDELT parse, GTFS-RT decode, ADS-B dedupe"
license = "MIT"

[[bin]]
name = "krynara-native"
path = "src/main.rs"

[dependencies]
serde_json = "1"
sysinfo = "0.33"
flate2 = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true